<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Packages of BeamletOptics and who loads what</title>
  <desc id="desc">BeamletOpticsGUI uses BeamletOpticsProjects and BeamletOptics; BeamletOpticsProjects uses BeamletOptics. A person in the window loads the GUI; an agent without a window loads BeamletOpticsProjects, and GLMakie for images (planned).</desc>
  <!-- Style of the mermaid graphs of the BeamletOptics docs (docs/src/api/core.md): Julia colors as
       2 px strokes with 15 % fill, bold titles, participants as dashed red stadiums -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      text { font-family: "trebuchet ms", verdana, arial, sans-serif; fill: #333; }
      .title { font-size: 16px; font-weight: bold; }
      .line { font-size: 13.5px; }
      .label { font-size: 12.5px; fill: #555; }
      .edge { fill: none; stroke: #555; stroke-width: 1.5px; }
      .dashed { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="800" height="600" rx="10" fill="#ffffff"/>

  <!-- participants -->
  <rect x="80" y="26" width="220" height="44" rx="22" fill="none" stroke="#CB3C33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="190" y="47" class="title" text-anchor="middle">Person</text>
  <text x="190" y="63" class="line" text-anchor="middle">in the window</text>
  <rect x="500" y="26" width="220" height="44" rx="22" fill="none" stroke="#CB3C33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="610" y="47" class="title" text-anchor="middle">Agent</text>
  <text x="610" y="63" class="line" text-anchor="middle">without a window</text>

  <!-- BeamletOpticsGUI (purple) -->
  <rect x="40" y="130" width="300" height="118" rx="5" fill="#9558B2" fill-opacity="0.15" stroke="#9558B2" stroke-width="2"/>
  <text x="190" y="155" class="title" text-anchor="middle">BeamletOpticsGUI 0.3</text>
  <text x="190" y="177" class="line" text-anchor="middle">the user interface: window, cards,</text>
  <text x="190" y="195" class="line" text-anchor="middle">autosave, overlays; applies merge_plan</text>
  <text x="190" y="213" class="line" text-anchor="middle">Makie, NativeFileDialog</text>
  <text x="190" y="235" class="line" text-anchor="middle">ext: GLMakie · agent skill</text>

  <!-- GLMakie (neutral) -->
  <rect x="540" y="158" width="200" height="62" rx="5" fill="#888888" fill-opacity="0.1" stroke="#888" stroke-width="2"/>
  <text x="640" y="183" class="title" text-anchor="middle">GLMakie</text>
  <text x="640" y="203" class="line" text-anchor="middle">OpenGL (xvfb headless)</text>

  <!-- BeamletOpticsProjects (green) -->
  <rect x="230" y="300" width="340" height="136" rx="5" fill="#389826" fill-opacity="0.15" stroke="#389826" stroke-width="2"/>
  <text x="400" y="325" class="title" text-anchor="middle">BeamletOpticsProjects 0.1</text>
  <text x="400" y="347" class="line" text-anchor="middle">the protocol of a project: format,</text>
  <text x="400" y="365" class="line" text-anchor="middle">load/save, merge_plan, versions (LibGit2),</text>
  <text x="400" y="383" class="line" text-anchor="middle">trace, look, participants, teams, evaluate</text>
  <text x="400" y="401" class="line" text-anchor="middle">stdlib only, no Makie</text>
  <text x="400" y="423" class="line" text-anchor="middle">agent skill · ext GLMakie: render (planned)</text>

  <!-- BeamletOptics (blue) -->
  <rect x="230" y="486" width="340" height="96" rx="5" fill="#4063D8" fill-opacity="0.15" stroke="#4063D8" stroke-width="2"/>
  <text x="400" y="511" class="title" text-anchor="middle">BeamletOptics 0.14</text>
  <text x="400" y="533" class="line" text-anchor="middle">physics, components, solve_system!,</text>
  <text x="400" y="551" class="line" text-anchor="middle">path_segments</text>
  <text x="400" y="571" class="line" text-anchor="middle">ext: Makie (render!) · OpticsBase · agent skill</text>

  <!-- who loads what -->
  <path class="edge" d="M 190 70 L 190 128" marker-end="url(#arrow)"/>
  <text x="198" y="104" class="label">loads</text>
  <path class="edge" d="M 588 70 L 456 296" marker-end="url(#arrow)"/>
  <text x="512" y="262" class="label">loads</text>
  <path class="edge dashed" d="M 640 70 L 640 156" marker-end="url(#arrow)"/>
  <text x="648" y="104" class="label">for images</text>
  <text x="648" y="119" class="label">(planned)</text>

  <!-- dependencies -->
  <path class="edge" d="M 250 248 L 340 298" marker-end="url(#arrow)"/>
  <text x="306" y="268" class="label">uses</text>
  <path class="edge" d="M 120 248 L 120 520 Q 120 534 134 534 L 228 534" marker-end="url(#arrow)"/>
  <text x="128" y="392" class="label">uses</text>
  <path class="edge" d="M 400 436 L 400 484" marker-end="url(#arrow)"/>
  <text x="408" y="465" class="label">uses</text>
  <path class="edge dashed" d="M 340 189 L 538 189" marker-end="url(#arrow)"/>
  <text x="439" y="182" class="label" text-anchor="middle">extension</text>
</svg>
